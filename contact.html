<!DOCTYPE html>
<html lang="en" class="no-js">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contact — Shams Fire Protection & MEP</title>
<meta name="description" content="Request a quotation or talk to the Shams technical team about fire protection, fire alarm, HVAC, low current, BMS and security.">
<meta name="theme-color" content="#e2554b">
<link rel="icon" href="assets/images/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<script src="js/lang.js"></script>
</head>
<body data-page="contact">
<main id="main">
<section class="page-hero">
  <svg class="blob b1" viewBox="0 0 400 400" aria-hidden="true"><path fill="#fadcd7" d="M318 52c48 32 66 98 40 156s-82 86-140 122-104 42-134-4S36 246 62 186 148 92 206 58s64-38 112-6z"/></svg><svg class="blob b2" viewBox="0 0 400 400" aria-hidden="true"><path fill="#f4b0a8" d="M140 30c40-20 94-4 126 28s34 82 16 124-52 62-84 92-76 52-112 30S22 266 36 212s-6-84 22-124c16-26 44-44 82-58z"/></svg>
  <div class="wrap">
    <nav class="crumbs" aria-label="Breadcrumb"><a href="index.html">Home</a> / <span>Contacts</span></nav>
    <span class="eyebrow">Contact us</span>
    <h1 class="h1">Let's talk about <span class='hl'>your project.</span></h1>
    <p class="lead">Send us your requirements, drawings or BOQ and our technical team will get back to you with a quotation.</p>
  </div>
</section>
<section class="section" style="padding-top:clamp(24px,4vw,48px)"><div class="wrap contact-grid">
  <form class="form reveal" id="quoteForm" novalidate>
    <h2 class="h3">Request a quote</h2>
    <div class="row">
      <div class="field"><label for="name">Full name *</label><input id="name" name="name" required autocomplete="name"></div>
      <div class="field"><label for="company">Company</label><input id="company" name="company" autocomplete="organization"></div>
    </div>
    <div class="row">
      <div class="field"><label for="email">Email *</label><input id="email" name="email" type="email" required autocomplete="email"></div>
      <div class="field"><label for="phone">Phone</label><input id="phone" name="phone" type="tel" autocomplete="tel"></div>
    </div>
    <div class="field"><label for="service">Service</label><select id="service" name="service"></select></div>
    <div class="field"><label for="message">Project details *</label><textarea id="message" name="message" required placeholder="Tell us about the system, location and timeline…"></textarea></div>
    <button class="btn btn-primary" type="submit">Send request <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
    <p class="form-status" id="formStatus" role="status" hidden></p>
    <p class="form-note">We reply to every request — usually within one working day.</p>
  </form>
  <aside class="info-stack" data-render="contact"></aside>
</div></section></main>
<script src="js/data/site.js"></script>
<script src="js/data/services.js"></script>
<script src="js/data/products.js"></script>
<script src="js/data/partners.js"></script>
<script src="js/data/clients.js"></script>
<script src="js/data/projects.js"></script>
<script src="js/i18n-ar.js"></script>
<script src="js/main.js"></script>
<script src="js/motion.js"></script>
</body>
</html>
