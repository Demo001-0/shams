<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Shop – Shams Cosmetics</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&family=Marcellus&family=Assistant:wght@300;400;600&family=Tajawal:wght@300;400;500&display=swap">
<link rel="stylesheet" href="css/main.css">
<script src="js/features/theme.js"></script>
</head>
<body>
<main>
  <section class="hero collection-hero"><div class="container">
    <div><h1 id="title">All Products</h1><p id="subtitle">Discover skincare and makeup made to glow.</p></div>
    <div class="hero-img" id="heroImg"></div>
  </div></section>

  <div class="container">
    <div class="toolbar">
      <div class="left">
        <span>Filter:</span>
        <details class="filter"><summary>Availability</summary>
          <div class="dropdown">
            <label><input type="checkbox" id="fIn"> In stock</label>
            <label><input type="checkbox" id="fOut"> Out of stock</label>
          </div></details>
        <details class="filter"><summary>Price</summary>
          <div class="dropdown"><div class="row"><input type="number" id="pMin" placeholder="From"> <span>–</span> <input type="number" id="pMax" placeholder="To"></div></div></details>
        <details class="filter"><summary>Category</summary>
          <div class="dropdown" id="catList"></div></details>
      </div>
      <div class="right">
        <label>Sort by:
          <select class="sort" id="sort">
            <option value="new">Date, new to old</option>
            <option value="old">Date, old to new</option>
            <option value="az">Alphabetically, A-Z</option>
            <option value="low">Price, low to high</option>
            <option value="high">Price, high to low</option>
          </select></label>
        <span id="count"></span>
      </div>
    </div>
    <div class="grid" id="grid"></div>
  </div>
</main>
<script src="js/data/products.js"></script>
<script src="js/core/config.js"></script>
<script src="js/components/product-visual.js"></script>
<script src="js/core/icons.js"></script>
<script src="js/core/navigation.js"></script>
<script src="js/components/layout.js"></script>
<script src="js/components/cart-state.js"></script>
<script src="js/core/ui.js"></script>
<script src="js/components/cart.js"></script>
<script src="js/components/product-card.js"></script>
<script src="js/components/search.js"></script>
<script src="js/core/bootstrap.js"></script>
<script src="js/pages/shop.js"></script>
</body>
</html>
